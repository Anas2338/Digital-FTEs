[project]
name = "digital-fte-mcp-server"
version = "0.1.0"
description = "Digital FTE MCP Server - Model Context Protocol server for external actions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "keyring>=24.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
